<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1929"/>
      <stop offset="1" stop-color="#102a3e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg4)"/>

  <!-- graticule -->
  <g stroke="#274b66" stroke-width="1.5" opacity="0.5">
    <path d="M80 300 H1200 M80 430 H1200 M80 560 H1200"/>
    <path d="M320 200 V600 M560 200 V600 M800 200 V600 M1040 200 V600"/>
  </g>

  <!-- satellite -->
  <g transform="translate(1030 215) rotate(-20)">
    <rect x="-34" y="-22" width="68" height="44" fill="none" stroke="#7fa8d4" stroke-width="3.5"/>
    <rect x="-118" y="-14" width="70" height="28" fill="#1e6b7c" stroke="#7fa8d4" stroke-width="2.5"/>
    <rect x="48" y="-14" width="70" height="28" fill="#1e6b7c" stroke="#7fa8d4" stroke-width="2.5"/>
    <path d="M-95 -14 v28 M-72 -14 v28 M71 -14 v28 M94 -14 v28" stroke="#7fa8d4" stroke-width="1.5"/>
    <path d="M-48 0 h14 M34 0 h14" stroke="#7fa8d4" stroke-width="2.5"/>
    <circle cx="0" cy="34" r="9" fill="none" stroke="#f4a72c" stroke-width="2.5"/>
  </g>

  <!-- scan beam -->
  <path d="M1008 260 L470 315 L790 545 Z" fill="#f4a72c" opacity="0.07"/>
  <path d="M1008 260 L470 315 M1008 260 L790 545" stroke="#f4a72c" stroke-width="2" stroke-dasharray="10 10" opacity="0.65"/>

  <!-- building footprints (satellite-derived) -->
  <g>
    <rect x="380" y="330" width="70" height="50" fill="#2a8fa1"/>
    <rect x="462" y="330" width="50" height="50" fill="#1e6b7c"/>
    <rect x="524" y="325" width="80" height="55" fill="#17505e"/>
    <rect x="616" y="330" width="60" height="50" fill="#2a8fa1"/>
    <rect x="688" y="335" width="70" height="45" fill="#1e6b7c"/>
    <rect x="380" y="400" width="55" height="60" fill="#1e6b7c"/>
    <rect x="447" y="400" width="65" height="60" fill="#3fb0bf"/>
    <rect x="524" y="395" width="60" height="65" fill="#2a8fa1"/>
    <rect x="596" y="400" width="80" height="55" fill="#17505e"/>
    <rect x="688" y="395" width="60" height="60" fill="#2a8fa1"/>
    <rect x="380" y="480" width="75" height="55" fill="#17505e"/>
    <rect x="467" y="480" width="55" height="55" fill="#2a8fa1"/>
    <rect x="534" y="475" width="70" height="60" fill="#1e6b7c"/>
    <rect x="616" y="480" width="55" height="55" fill="#3fb0bf"/>
    <rect x="683" y="475" width="75" height="60" fill="#1e6b7c"/>
  </g>
  <!-- reference footprints (ground truth, amber dashed) -->
  <g fill="none" stroke="#f4a72c" stroke-width="3" stroke-dasharray="10 8">
    <rect x="455" y="323" width="62" height="60"/>
    <rect x="518" y="390" width="70" height="72"/>
    <rect x="610" y="473" width="66" height="64"/>
    <rect x="770" y="400" width="58" height="52"/>
  </g>

  <!-- legend -->
  <g font-size="24" fill="#a9c3dd">
    <rect x="890" y="392" width="34" height="26" fill="#2a8fa1"/>
    <text x="938" y="412">Satellite-derived</text>
    <rect x="890" y="440" width="34" height="26" fill="none" stroke="#f4a72c" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="938" y="460">Reference</text>
    <text x="890" y="512" fill="#7fa8d4">precision · recall · F1 · IoU</text>
  </g>

  <!-- title -->
  <text x="80" y="112" fill="#e8f0f8" font-size="52" font-weight="600">Satellite-Derived Building Datasets</text>
  <text x="80" y="152" fill="#7fa8d4" font-size="26">Independent validation of global building footprint and settlement layers</text>
</svg>
